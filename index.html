<style>
  :root{
    --ground:#061629;
    --paper:#EEF4ED;
    --gold:#B98F3E;
    --council:#134074;
    --steel:#9FB0C0;
    --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    --latin:"Cinzel","Trajan Pro",Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    min-height:100vh;min-height:100dvh;
    background:var(--ground);color:#fff;
    display:grid;place-items:center;text-align:center;
    padding:2rem;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .layer{position:fixed;pointer-events:none}

  /* 霧 mist */
  .mist{inset:-20%}
  .mist::before,.mist::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);will-change:transform}
  .mist::before{width:60vmax;height:40vmax;left:5%;top:15%;background:radial-gradient(closest-side,rgba(19,64,116,.45),transparent)}
  .mist::after{width:50vmax;height:35vmax;right:5%;bottom:20%;background:radial-gradient(closest-side,rgba(159,176,192,.10),transparent)}

  /* 青海波 seigaiha — moved with transform (GPU) rather than repainting background-position */
  .waves{inset:0;overflow:hidden;opacity:.18;
    -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.35) 30%,transparent 62%);
            mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.35) 30%,transparent 62%)}
  .waves::before{content:"";position:absolute;inset:0 -48px 0 0;
    background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='48'%20height='24'%20viewBox='0%200%2048%2024'%3E%3Ccircle%20cx='24'%20cy='0'%20r='24'%20fill='%23061629'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='0'%20r='18'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='0'%20r='12'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='0'%20r='6'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='0'%20cy='12.0'%20r='24'%20fill='%23061629'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='0'%20cy='12.0'%20r='18'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='0'%20cy='12.0'%20r='12'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='0'%20cy='12.0'%20r='6'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='48'%20cy='12.0'%20r='24'%20fill='%23061629'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='48'%20cy='12.0'%20r='18'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='48'%20cy='12.0'%20r='12'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='48'%20cy='12.0'%20r='6'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='24'%20r='24'%20fill='%23061629'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='24'%20r='18'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='24'%20r='12'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='24'%20r='6'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='0'%20cy='36.0'%20r='24'%20fill='%23061629'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='0'%20cy='36.0'%20r='18'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='0'%20cy='36.0'%20r='12'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='0'%20cy='36.0'%20r='6'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='48'%20cy='36.0'%20r='24'%20fill='%23061629'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='48'%20cy='36.0'%20r='18'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='48'%20cy='36.0'%20r='12'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='48'%20cy='36.0'%20r='6'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='48'%20r='24'%20fill='%23061629'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='48'%20r='18'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='48'%20r='12'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3Ccircle%20cx='24'%20cy='48'%20r='6'%20fill='none'%20stroke='%23B98F3E'%20stroke-width='1'/%3E%3C/svg%3E") 0 0/48px 24px;will-change:transform}

  .veil{inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(2,8,16,.75) 100%)}

  /* 家紋 crest */
  .crest{
    left:50%;top:50%;
    width:min(62vw,440px);height:auto;overflow:visible;
    transform:translate(-50%,-50%);
    opacity:.1;
  }
  .crest path{fill:var(--paper);stroke:var(--gold);stroke-width:0;stroke-linejoin:round}

  /* 縦書き vertical creed */
  .tate{right:clamp(1rem,4vw,3rem);top:50%;transform:translateY(-50%);
    writing-mode:vertical-rl;font-family:var(--jp);font-weight:400;
    font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.6em;color:rgba(238,244,237,.14)}

  main{position:relative;z-index:1}
  h1{font-family:var(--jp);font-weight:900;font-size:clamp(3.5rem,14vw,9rem);
    line-height:1;letter-spacing:.06em;text-shadow:0 0 40px rgba(6,22,41,.9)}
  p{font-family:var(--latin);font-weight:600;font-size:clamp(1rem,3.2vw,1.8rem);
    letter-spacing:.55em;margin:1.5rem 0 0 .55em}

  /* ── Crest reveal: gold ink draws the square frame, then the ring and torii,
        the blade drops through the centre, the ink fills, and the crest recedes
        into the dark as the name appears. ~3.6s total. ── */
  @media (prefers-reduced-motion:no-preference){
    .crest{animation:recede 1.2s cubic-bezier(.4,0,.2,1) 2.4s both}
    .crest path{stroke-width:4;stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0}
    .frame path{animation:ink 1.4s cubic-bezier(.65,0,.35,1) .1s forwards, fill .7s ease-out 1.9s forwards}
    .ring  path{animation:ink 1.4s cubic-bezier(.65,0,.35,1) .5s forwards, fill .7s ease-out 1.9s forwards}
    .sword{animation:blade .7s cubic-bezier(.2,.9,.25,1) 1.45s both}
    .sword path{stroke-dashoffset:0;animation:fill .5s ease-out 1.6s forwards}
    main{animation:rise 1s ease-out 2.6s both}

    .mist::before{animation:drift 40s ease-in-out infinite alternate}
    .mist::after{animation:drift 55s ease-in-out infinite alternate-reverse}
    .waves::before{animation:tide 24s linear infinite}
    .crest-idle{animation:breathe 12s ease-in-out 4s infinite}

    @keyframes ink{to{stroke-dashoffset:0}}
    @keyframes fill{to{fill-opacity:1;stroke-width:0}}
    @keyframes blade{from{transform:translateY(-14%);opacity:0}to{transform:none;opacity:1}}
    @keyframes recede{from{opacity:.85;transform:translate(-50%,-50%) scale(1.04)}to{opacity:.1;transform:translate(-50%,-50%) scale(1)}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes breathe{50%{opacity:.6}}
    @keyframes drift{to{transform:translate(8vw,-4vh)}}
    @keyframes tide{to{transform:translateX(-48px)}}
  }
  .credit{left:0;right:0;bottom:max(1.25rem,env(safe-area-inset-bottom));z-index:1;
    font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:.8rem;letter-spacing:.08em;
    color:rgba(159,176,192,.55);pointer-events:auto}
  @media (prefers-reduced-motion:no-preference){.credit{animation:rise 1s ease-out 3.2s both}}
  @media (max-width:600px){.tate{display:none}}
</style>
</head>
